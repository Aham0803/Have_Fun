{% extends 'base.html' %}

{% block title %}404 - Page Not Found | CineGlow{% endblock %}

{% block content %}
<div class="container text-center not-found-wrapper">
    <div class="not-found-icon">
        <i class="fa-solid fa-film"></i>
        <span class="error-code">404</span>
    </div>
    <h1 class="not-found-title">Oops! Scene Missing</h1>
    <p class="not-found-subtitle">
        The movie reel or page you were looking for doesn't exist or has ended its theatrical run.
    </p>
    <div class="not-found-actions">
        <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="fa-solid fa-house"></i> Return to Homepage</a>
        <a href="{{ url_for('my_bookings') }}" class="btn btn-outline"><i class="fa-solid fa-ticket"></i> Search Bookings</a>
    </div>
</div>
{% endblock %}
